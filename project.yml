name: SD2SnesCommander

options:
  bundleIdPrefix: net.ringum
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  settingPresets: none

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MTL_FAST_MATH: YES
    SDKROOT: macosx
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Shared by every target.
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    PRODUCT_NAME: $(TARGET_NAME)
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  SD2SnesCommander:
    type: application
    platform: macOS
    sources:
      - path: SD2SnesCommander
        excludes:
          - Info.plist
          - SD2SnesCommander.entitlements
    dependencies:
      - target: sd2snes
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: SD2snesCommanderCore
      - target: SD2SnesUSBService
      - sdk: IOUSBHost.framework
      - sdk: IOKit.framework
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        ENABLE_PREVIEWS: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PRINTING: NO
        ENABLE_RESOURCE_ACCESS_USB: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        GENERATE_INFOPLIST_FILE: YES
        # Info.plist in the folder is unused; the plist is generated.
        INFOPLIST_FILE: ""
        INFOPLIST_KEY_CFBundleDisplayName: SD2Snes Commander
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        PRODUCT_BUNDLE_IDENTIFIER: net.ringum.sd2snescommander
        REGISTER_APP_GROUPS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES

  SD2snesCommanderCore:
    type: framework
    platform: macOS
    sources:
      - path: SD2snesCommanderCore
        excludes:
          - USB/sd2snes_usb.h
      - path: SD2snesCommanderCore/USB/sd2snes_usb.h
        headerVisibility: public
    dependencies:
      - sdk: IOKit.framework
    settings:
      base:
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        COMBINE_HIDPI_IMAGES: YES
        DEFINES_MODULE: YES
        DYLIB_COMPATIBILITY_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        ENABLE_MODULE_VERIFIER: YES
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/SD2snesCommanderCore/
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INSTALL_PATH: $(LOCAL_LIBRARY_DIR)/Frameworks
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/Frameworks"]
        MACH_O_TYPE: mh_dylib
        MODULE_VERIFIER_SUPPORTED_LANGUAGES: objective-c objective-c++
        MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: gnu17 gnu++20
        PRODUCT_BUNDLE_IDENTIFIER: net.ringum.sd2snescommander.core
        PRODUCT_NAME: $(TARGET_NAME:c99extidentifier)
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_INSTALL_MODULE: YES
        SWIFT_INSTALL_OBJC_HEADER: NO
        VERSIONING_SYSTEM: apple-generic
        VERSION_INFO_PREFIX: ""

  sd2snes:
    type: tool
    platform: macOS
    sources: [sd2snes]
    dependencies:
      - target: SD2snesCommanderCore
        embed: false
    settings:
      base:
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks", "@executable_path"]
        PRODUCT_BUNDLE_IDENTIFIER: net.ringum.sd2snescommander.cli
        PROVISIONING_PROFILE_SPECIFIER: ""

  SD2SnesUSBService:
    type: xpc-service
    platform: macOS
    deploymentTarget: "26.4"
    sources:
      - path: SD2SnesUSBService
        excludes: [Info.plist]
    dependencies:
      - target: SD2snesCommanderCore
        embed: false
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SD2SnesUSBService/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SD2SnesUSBService
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"
        MACOSX_DEPLOYMENT_TARGET: "26.4"
        PRODUCT_BUNDLE_IDENTIFIER: net.ringum.sd2snescommander.usbservice
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  SD2SnesCommanderTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SD2SnesCommanderTests]
    dependencies:
      - target: SD2SnesCommander
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.ringum.sd2snescommander.tests
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SD2SnesCommander.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SD2SnesCommander

  SD2snesCommanderCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SD2snesCommanderCoreTests]
    dependencies:
      - target: SD2snesCommanderCore
        embed: false
      - target: SD2SnesCommander
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.ringum.sd2snescommander.core.tests
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SD2SnesCommander.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SD2SnesCommander

  SD2SnesCommanderUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [SD2SnesCommanderUITests]
    dependencies:
      - target: SD2SnesCommander
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.ringum.sd2snescommander.uitests
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_TARGET_NAME: SD2SnesCommander

schemes:
  SD2SnesCommander:
    build:
      targets:
        SD2SnesCommander: all
    test:
      targets:
        - SD2snesCommanderCoreTests
        - SD2SnesCommanderTests
        - SD2SnesCommanderUITests
